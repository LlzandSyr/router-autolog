name: AnyRouter 自动签到

on:
  schedule:
    - cron: '0 17 * * *'
    - cron: '5 17 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  checkin-primary:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 17 * * *' || github.event.schedule == '0 4 * * *'
    name: 主账号签到 (01:00 CST)
    runs-on: windows-2025
    environment: production
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v3
      with:
        version: 'latest'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      if: steps.uv-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装项目依赖..."
        uv sync
        echo "✅ 环境初始化完成"

    - name: 获取 Playwright 版本
      id: playwright-version
      run: |
        $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Playwright version: $version"

    - name: 缓存 Playwright 浏览器
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: 安装 Playwright 浏览器
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装 Playwright 浏览器..."
        uv run playwright install chromium --with-deps

    - name: 恢复余额历史缓存
      uses: actions/cache@v4
      with:
        path: balance_hash.txt
        key: balance-hash-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          balance-hash-${{ github.job }}-

    - name: 执行签到（失败10分钟后重试，最多重试3次）
      env:
        PYTHONIOENCODING: utf-8
        ONLY_ACCOUNT: '223103'
        SCHEDULE_SLOT: ${{ github.event.schedule }}
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
      run: |
        # 站点每日签到按 UTC 午夜重置(约北京 8:00)。凌晨槽位的 run 先挂机到 UTC 00:45(重置后)再签，
        # 实现“北京 8:45 前签完、早上醒来即见”。等待上限 5h45m 防止撞 6h job 硬限；若调度延迟不足
        # 导致醒来仍在旧 UTC 日，本次会假成功，由 12:00 CST 兜底 run 补签。兜底/手动触发不等待。
        if ($env:SCHEDULE_SLOT -eq '0 17 * * *' -or $env:SCHEDULE_SLOT -eq '5 17 * * *') {
          $now = [DateTime]::UtcNow
          $target = $now.Date.AddMinutes(45)
          if ($target -le $now) { $target = $target.AddDays(1) }
          $wait = [int]($target - $now).TotalSeconds
          $cap = 5*3600 + 45*60
          if ($wait -gt 0) {
            if ($wait -gt $cap) {
              Write-Host ("[WAIT] {0:N0}s until reset exceeds cap; sleeping {1:N0}s, midday fallback will cover today if needed." -f $wait, $cap)
              $wait = $cap
            }
            Write-Host ("[WAIT] Sleeping {0:N0}s until {1:yyyy-MM-dd HH:mm} UTC (site daily reset)..." -f $wait, $target)
            Start-Sleep -Seconds $wait
          }
        }
        for ($i = 1; $i -le 4; $i++) {
          uv run checkin.py
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($i -lt 4) {
            Write-Host "Attempt $i failed, waiting 10 minutes before retry..."
            Start-Sleep -Seconds 600
          }
        }
        Write-Host 'All 4 attempts failed, giving up.'
        exit 1

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(Get-Date)"

  checkin-gopher:
